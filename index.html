<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polla Mundialista 2026</title>
  <meta name="description" content="Sigue las posiciones, apuestas y estadísticas de la polla mundialista Copa del Mundo 2026." />

  <!-- Open Graph / WhatsApp / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ricardona.github.io/apuestas-copa-mundo-2026/" />
  <meta property="og:title" content="Polla Mundialista 2026 ⚽" />
  <meta property="og:description" content="Sigue las posiciones, apuestas y estadísticas de la polla mundialista Copa del Mundo 2026." />
  <meta property="og:image" content="https://ricardona.github.io/apuestas-copa-mundo-2026/img/banner.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="es_CO" />
  <meta property="og:site_name" content="Polla Mundialista 2026" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Polla Mundialista 2026 ⚽" />
  <meta name="twitter:description" content="Sigue las posiciones, apuestas y estadísticas de la polla mundialista Copa del Mundo 2026." />
  <meta name="twitter:image" content="https://ricardona.github.io/apuestas-copa-mundo-2026/img/banner.png" />

  <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
  <link rel="manifest" href="/img/site.webmanifest" />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link href="/src/style.css" rel="stylesheet" />
</head>

<body>

  <div class="header">
    <div class="logo">
      <button class="logo-home logo-icon-button" data-target="ranking" aria-label="Volver a posiciones">
        <div class="logo-icon">⚽</div>
      </button>
      <div class="logo-copy">
        <button class="logo-home logo-text" data-target="ranking">Polla Mundialista</button>
        <div class="header-actions">
          <button class="instrucciones-link" id="btn-instrucciones" onclick="window.openInstrucciones?.()">Instrucciones</button>
          <button class="header-action-link" data-target="mis-apuestas">✏️ Mis Apuestas</button>
        </div>
      </div>
    </div>
    <div class="header-meta">
      <div id="clerk-root"></div>
    </div>
  </div>

  <div id="global-loader" class="global-loader">
    <div class="spinner"></div>
    <div class="loader-text">Cargando datos y partidos...</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-target="ranking">Posiciones</button>
    <button class="tab" data-target="partidos">Partidos</button>
    <button class="tab" data-target="plus">Plus</button>
    <button class="tab" data-target="estadisticas">Estadísticas</button>
  </div>

  <div class="main">

    <div class="section active" id="tab-ranking">
      <div class="section-label">Tabla de posiciones</div>
      <div class="legend">
        <span><span class="ldot" style="background:#4caf7d"></span>Marcador exacto (×mult)</span>
        <span><span class="ldot" style="background:#4a9eff"></span>Tendencia (×mult)</span>
        <span><span class="ldot" style="background:#444"></span>Error (0 pts)</span>
      </div>
      <div class="ranking-wrap">
        <table class="r-table">
          <thead>
            <tr>
              <th style="width:36px">#</th>
              <th>Jugador</th>
              <th class="r">Total</th>
              <th class="r" title="Puntos de partidos">Partidos</th>
              <th class="r" title="Puntos Plus (grupos, top4, etc.)">Plus</th>
              <th class="r">Errores</th>
            </tr>
          </thead>
          <tbody id="ranking-body"></tbody>
        </table>
      </div>
    </div>

    <div class="section" id="tab-partidos">
      <div class="section-label">Historial y apuestas</div>
      <div id="matches-list"></div>
    </div>

    <div class="section" id="tab-plus">
      <div class="section-label">Plus</div>
      <div id="plus-content"></div>
    </div>

    <div class="section" id="tab-estadisticas">
      <div class="section-label">Estadísticas y Tendencias</div>
      <div class="metrics" id="metrics-row"></div>
      <div class="chart-container" style="position: relative; height:400px; width:100%; margin-bottom:28px;">
        <canvas id="pointsChart"></canvas>
      </div>

      <div class="stats-grid" id="stats-grid">
        <!-- Rendered via JS -->
      </div>
    </div>

    <div class="section" id="tab-mis-apuestas">
      <div class="section-label">Editar mis apuestas</div>
      <div id="mis-apuestas-content"></div>
    </div>

  </div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
